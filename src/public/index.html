<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAGP Insurance Documents</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
      }

      .upload-card {
        width: 420px;
        padding: 32px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 26px;
      }

      .description {
        margin-bottom: 25px;
        color: #666;
      }

      .file-input {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      .upload-button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      .upload-button:hover {
        background: #1d4ed8;
      }
    </style>

    <script defer>
      document.addEventListener("DOMContentLoaded", () => {
        const uploadForm = document.getElementById("uploadform");
        uploadForm.addEventListener("submit", handleFileUpload);
        updateButtonState();
      });

      let uploading = false;

      const updateButtonState = () => {
        const button = document.getElementById("uploadBtn");
        button.textContent = uploading ? "Uploading..." : "Upload Document";
        button.disabled = uploading;
      };

      const completeUpload = async (key, uploadId, parts) => {
        const res = await fetch("/upload/complete", {
          method: "POST",
          body: JSON.stringify({ key, uploadId, parts }),
          headers: {
            "Content-Type": "application/json",
          },
        });
        const data = await res.json();
        if (data.error) {
          throw new Error(data.error);
          return;
        }
      };

      const startUpload = async (uploadInfo) => {
        const { file, key, uploadId, presignedUrls } = uploadInfo;
        const chunkSize = 5 * 1024 * 1024; // 5MB
        const totalChunks = Math.ceil(file.size / chunkSize);
        let uploadedChunks = 0;
        const uploadedParts = [];
        for (let start = 0; start < file.size; start += chunkSize) {
          const end = Math.min(start + chunkSize, file.size);
          const chunk = file.slice(start, end);
          const uploadUrl = presignedUrls[uploadedChunks];
          const res = await fetch(uploadUrl, {
            method: "PUT",
            body: chunk,
            headers: {
              "Content-Type": file.type,
            },
          });
          uploadedChunks++;
          uploadedParts.push({
            ETag: res.headers.get("ETag"),
            PartNumber: uploadedChunks,
          });
          console.log(`Uploaded chunk ${uploadedChunks} of ${totalChunks}`);
        }

        await completeUpload(key, uploadId, uploadedParts);
      };
      const handleFileUpload = async (event) => {
        event.preventDefault();
        try {
          const file = document.getElementById("file").files[0];
          if (!file) return;
          const fileName = file.name;
          const fileType = file.type;
          const fileSize = file.size;
          const maxSizeMB = 100 * 1024 * 1024; // 100MB limit
          if (fileSize > maxSizeMB) {
            // 100MB limit
            alert("File size exceeds 100MB. Please select a smaller file.");
            event.target.value = ""; // Clear the input
            return;
          }
          uploading = true;
          updateButtonState();
          const res = await fetch("/upload/initiate", {
            method: "POST",
            body: JSON.stringify({
              fileName: fileName,
              contentType: fileType,
              fileSize: fileSize,
            }),
            headers: {
              "Content-Type": "application/json",
            },
          });
          const data = await res.json();
          if (data.error) {
            throw new Error(data.error);
            event.target.value = ""; // Clear the input
          }
          await startUpload({
            file: file,
            key: data.key,
            uploadId: data.uploadId,
            presignedUrls: data.presignedUrls,
          });
          event.target.reset(); // Reset the form after upload
          alert("File upload completed successfully!");
        } catch (error) {
          console.error("Error initiating upload:", error);
          alert("Error initiating upload. Please try again.");
        } finally {
          uploading = false;
          updateButtonState();
        }
      };
    </script>
  </head>

  <body>
    <div class="upload-card">
      <h1>Insurance Document Upload</h1>

      <p class="description">Upload your insurance document securely.</p>

      <form id="uploadform" enctype="multipart/form-data">
        <input class="file-input" type="file" id="file" name="file" required />

        <button class="upload-button" id="uploadBtn" type="submit">
          Upload Document
        </button>
      </form>
    </div>
  </body>
</html>
