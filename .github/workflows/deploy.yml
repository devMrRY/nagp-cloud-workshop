name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create deployment ZIP
        run: |
          zip -r app.zip . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*"

      - name: Upload to S3
        run: |
          aws s3 cp app.zip \
            s3://${{ secrets.S3_BUCKET }}/deployments/app-${{ github.sha }}.zip

          aws s3 cp app.zip \
            s3://${{ secrets.S3_BUCKET }}/deployments/latest.zip